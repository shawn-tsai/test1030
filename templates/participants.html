<!-- 查看報名清單頁面 -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>{{ event.title }} - 報名清單</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 700px;">
        <a href="/" class="btn btn-link mb-3">&larr; 返回活動列表</a>
        
        <div class="card shadow p-4">
            <h2>📋 {{ event.title }} - 報名清單</h2>
            <p class="mb-0">
                👥 目前報名人數：<strong>{{ participants | length }}</strong> 人
                {% if event.closed %}<span class="badge bg-secondary ms-1">已截止</span>{% endif %}
            </p>
            <hr>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>姓名</th>
                        <th>連絡電話</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in participants %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ p.name }}</td>
                        <td>{{ p.phone }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="3" class="text-center text-muted">目前尚無人報名</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
