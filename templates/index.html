<!-- 首頁 / 活動清單 -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>廢墟版活動報名平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>🏗️ 廢墟版活動報名平台</h1>
            <a href="/events/new" class="btn btn-dark">+ 新增活動</a>
        </div>

        <div class="row">
            {% for event in events %}
            <div class="col-md-4 mb-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">{{ event.title }}</h5>
                        <p class="card-text text-muted">{{ event.description }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <a href="/events/{{ event.id }}" class="btn btn-primary btn-sm">查看並報名</a>
                            <a href="/events/{{ event.id }}/participants" class="btn btn-outline-secondary btn-sm">查看名單</a>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
